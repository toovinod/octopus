name: Release

on:
  push:
    branches: [main]
  # Builds the desktop downloads by hand: for a tag, to attach them again after a failed build, and without one,
  # only to check that they still build.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the downloads to, such as v0.1.1. Leave empty to only build.
        required: false
        default: ""

# Read-only by default. The build jobs run third-party code (bun install, the builds), so only the jobs that run
# none get write access.
permissions:
  contents: read

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Here and not on the release event: a release made with GITHUB_TOKEN starts no other workflow.
  desktop:
    name: Desktop download (${{ matrix.name }})
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            artifact: macos-arm64
            os: macos-15
            files: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - name: macOS Intel
            artifact: macos-x64
            os: macos-15-intel
            files: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - name: Linux x64
            artifact: linux-x64
            os: ubuntu-24.04
            bundles: deb,appimage
            files: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          - name: Linux arm64
            artifact: linux-arm64
            os: ubuntu-24.04-arm
            bundles: deb,appimage
            files: |
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop/src-tauri
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential file
      - run: bun install --frozen-lockfile
      # The desktop package's own build skips bundling, so build what it bundles, then bundle here.
      - run: bunx turbo run build --filter=daemon --filter=web
      - run: bunx tauri build --bundles ${{ matrix.bundles }}
        if: runner.os == 'Linux'
        working-directory: apps/desktop
      - name: Build the macOS app
        if: runner.os == 'macOS'
        run: bun run tauri build --no-bundle
        working-directory: apps/desktop
      - name: Bundle the macOS disk image
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        shell: bash
        run: |
          bundle_log=$(mktemp)
          trap 'rm -f "$bundle_log"' EXIT
          for attempt in 1 2 3; do
            if bun run tauri bundle --bundles dmg >"$bundle_log" 2>&1; then
              cat "$bundle_log"
              exit 0
            else
              status=$?
            fi
            cat "$bundle_log"
            # Hosted macOS runners can temporarily hold a file open during hdiutil create.
            if [[ "$attempt" -eq 3 ]] || ! grep -Fq 'hdiutil: create failed - Resource busy' "$bundle_log"; then
              exit "$status"
            fi
            echo "::warning::hdiutil reported a busy resource on attempt $attempt. Retrying the DMG bundle."
            sleep "$((attempt * 5))"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  # Uploads what the builds made with the only write token, and runs no code from the repository or its dependencies.
  attach:
    name: Attach the downloads to the release
    needs: [release-please, desktop]
    if: ${{ !cancelled() && (needs.release-please.outputs.tag_name || inputs.tag) != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: downloads
          merge-multiple: true
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find downloads -type f -print0 | xargs -0 ls -l
          find downloads -type f -print0 | xargs -0 gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY"
